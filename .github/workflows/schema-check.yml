name: Schema Drift Check
on:
  schedule:
    - cron: "0 9 * * MON" # Every Monday at 9 AM
  workflow_dispatch:

jobs:
  check-schema:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check for schema drift in ${{ matrix.environment }}
        env:
          DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', matrix.environment)] }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ ${ENVIRONMENT^^}_DATABASE_URL secret not configured. Skipping schema drift check."
            exit 0
          fi
          echo "Checking schema drift for ${{ matrix.environment }} environment..."
          npx prisma db pull
          if ! git diff --exit-code prisma/schema.prisma; then
            echo "⚠️ Schema drift detected in ${{ matrix.environment }} environment!"
            exit 1
          fi
          echo "✅ No schema drift detected in ${{ matrix.environment }} environment."

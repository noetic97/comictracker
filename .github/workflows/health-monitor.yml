name: Health Monitor

on:
  schedule:
    # Run every hour (can adjust later)
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger

env:
  STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
  STAGING_ALERT_URL: ${{ secrets.STAGING_ALERT_URL }}
  PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
  PRODUCTION_ALERT_URL: ${{ secrets.PRODUCTION_ALERT_URL }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        environment: [staging, production]
      fail-fast: false # Continue checking other environments if one fails

    steps:
      - name: Set environment URLs
        run: |
          if [ "${{ matrix.environment }}" = "staging" ]; then
            echo "HEALTH_URL=${{ env.STAGING_HEALTH_URL }}" >> $GITHUB_ENV
            echo "ALERT_URL=${{ env.STAGING_ALERT_URL }}" >> $GITHUB_ENV
          else
            echo "HEALTH_URL=${{ env.PRODUCTION_HEALTH_URL }}" >> $GITHUB_ENV
            echo "ALERT_URL=${{ env.PRODUCTION_ALERT_URL }}" >> $GITHUB_ENV
          fi

      - name: Check Health Endpoint
        id: health_check
        run: |
          echo "🏥 Checking health for ${{ matrix.environment }}..."

          # Make the health check request with timeout
          response=$(curl -s -w "%{http_code}|%{time_total}" -m 30 "${{ env.HEALTH_URL }}" || echo "000|30.0")

          http_code=$(echo "$response" | tail -1 | cut -d'|' -f1)
          response_time=$(echo "$response" | tail -1 | cut -d'|' -f2)
          response_body=$(echo "$response" | head -n -1)

          echo "HTTP Code: $http_code"
          echo "Response Time: ${response_time}s"
          echo "Response: $response_body"

          # Store results for next step
          echo "http_code=$http_code" >> $GITHUB_OUTPUT
          echo "response_time=$response_time" >> $GITHUB_OUTPUT
          echo "response_body<<EOF" >> $GITHUB_OUTPUT
          echo "$response_body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Parse Health Response
        id: parse_health
        if: steps.health_check.outputs.http_code == '200'
        run: |
          # Parse JSON response to check if service is actually healthy
          response='${{ steps.health_check.outputs.response_body }}'

          # Extract 'ok' field from JSON
          ok=$(echo "$response" | jq -r '.ok // false' 2>/dev/null || echo "false")
          status=$(echo "$response" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
          db_connected=$(echo "$response" | jq -r '.database.connected // false' 2>/dev/null || echo "false")
          db_latency=$(echo "$response" | jq -r '.database.latencyMs // 0' 2>/dev/null || echo "0")

          echo "Service OK: $ok"
          echo "Status: $status"
          echo "DB Connected: $db_connected"
          echo "DB Latency: ${db_latency}ms"

          echo "ok=$ok" >> $GITHUB_OUTPUT
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "db_connected=$db_connected" >> $GITHUB_OUTPUT
          echo "db_latency=$db_latency" >> $GITHUB_OUTPUT

      - name: Log Success
        if: steps.health_check.outputs.http_code == '200' && steps.parse_health.outputs.ok == 'true'
        run: |
          echo "✅ ${{ matrix.environment }} is healthy!"
          echo "  Status: ${{ steps.parse_health.outputs.status }}"
          echo "  DB Connected: ${{ steps.parse_health.outputs.db_connected }}"
          echo "  DB Latency: ${{ steps.parse_health.outputs.db_latency }}ms"
          echo "  Response Time: ${{ steps.health_check.outputs.response_time }}s"

      - name: Send Alert for HTTP Error
        if: steps.health_check.outputs.http_code != '200'
        run: |
          echo "🚨 HTTP Error detected for ${{ matrix.environment }}"

          # Determine severity based on HTTP code
          if [ "${{ steps.health_check.outputs.http_code }}" = "000" ]; then
            severity="critical"
            message="Health endpoint completely unreachable (timeout or network error)"
          elif [ "${{ steps.health_check.outputs.http_code }}" = "404" ]; then
            severity="error"
            message="Health endpoint not found (HTTP 404)"
          elif [ "${{ steps.health_check.outputs.http_code }}" = "500" ]; then
            severity="critical"
            message="Health endpoint server error (HTTP 500)"
          else
            severity="warning"
            message="Health endpoint returned unexpected HTTP code: ${{ steps.health_check.outputs.http_code }}"
          fi

          # Send alert
          curl -X POST "${{ env.ALERT_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": \"$message\",
              \"severity\": \"$severity\",
              \"source\": \"github-actions-${{ matrix.environment }}\",
              \"metadata\": {
                \"http_code\": \"${{ steps.health_check.outputs.http_code }}\",
                \"response_time\": \"${{ steps.health_check.outputs.response_time }}\",
                \"environment\": \"${{ matrix.environment }}\",
                \"workflow_run\": \"${{ github.run_id }}\"
              }
            }" || echo "Failed to send alert"

      - name: Backup Check - Supabase Direct
        id: supabase_check
        if: steps.health_check.outputs.http_code != '200' || steps.parse_health.outputs.ok == 'false'
        run: |
          echo "🔄 Primary health check failed, trying Supabase direct heartbeat..."

          if [ -z "${{ env.SUPABASE_HEARTBEAT_URL }}" ]; then
            echo "⚠️ Supabase heartbeat URL not configured, skipping backup check"
            echo "supabase_ok=false" >> $GITHUB_OUTPUT
            echo "supabase_reason=not_configured" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Try Supabase direct connection
          supabase_response=$(curl -s -w "%{http_code}|%{time_total}" -m 30 "${{ env.SUPABASE_HEARTBEAT_URL }}" || echo "000|30.0")

          supabase_http_code=$(echo "$supabase_response" | tail -1 | cut -d'|' -f1)
          supabase_response_time=$(echo "$supabase_response" | tail -1 | cut -d'|' -f2)
          supabase_response_body=$(echo "$supabase_response" | head -n -1)

          echo "Supabase HTTP Code: $supabase_http_code"
          echo "Supabase Response Time: ${supabase_response_time}s"

          if [ "$supabase_http_code" = "200" ]; then
            # Parse Supabase response
            supabase_ok=$(echo "$supabase_response_body" | jq -r '.ok // false' 2>/dev/null || echo "false")
            supabase_db_connected=$(echo "$supabase_response_body" | jq -r '.database.connected // false' 2>/dev/null || echo "false")
            
            echo "Supabase OK: $supabase_ok"
            echo "Supabase DB Connected: $supabase_db_connected"
            
            echo "supabase_ok=$supabase_ok" >> $GITHUB_OUTPUT
            echo "supabase_db_connected=$supabase_db_connected" >> $GITHUB_OUTPUT
            echo "supabase_response_time=$supabase_response_time" >> $GITHUB_OUTPUT
            
            if [ "$supabase_ok" = "true" ] && [ "$supabase_db_connected" = "true" ]; then
              echo "✅ Supabase direct connection successful - issue is with Netlify layer"
              echo "supabase_reason=netlify_issue" >> $GITHUB_OUTPUT
            else
              echo "❌ Supabase also reporting issues"
              echo "supabase_reason=database_issue" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Supabase heartbeat also failed"
            echo "supabase_ok=false" >> $GITHUB_OUTPUT
            echo "supabase_reason=heartbeat_failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Enhanced Alert with Backup Results
        if: (steps.health_check.outputs.http_code != '200' || steps.parse_health.outputs.ok == 'false') && steps.supabase_check.conclusion != 'skipped'
        run: |
          echo "🚨 Sending enhanced alert with backup check results..."

          # Determine the root cause based on both checks
          if [ "${{ steps.supabase_check.outputs.supabase_reason }}" = "netlify_issue" ]; then
            severity="warning"
            message="Netlify function layer issue detected - Database is accessible via Supabase but not through Netlify functions"
            root_cause="netlify_layer"
          elif [ "${{ steps.supabase_check.outputs.supabase_reason }}" = "database_issue" ]; then
            severity="critical"
            message="Database connectivity issue - Both Netlify and Supabase direct access failing"
            root_cause="database"
          else
            severity="critical" 
            message="Complete system failure - All monitoring endpoints unreachable"
            root_cause="complete_failure"
          fi

          curl -X POST "${{ env.ALERT_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": \"$message\",
              \"severity\": \"$severity\",
              \"source\": \"github-actions-enhanced-${{ matrix.environment }}\",
              \"metadata\": {
                \"root_cause\": \"$root_cause\",
                \"primary_check\": {
                  \"http_code\": \"${{ steps.health_check.outputs.http_code }}\",
                  \"ok\": \"${{ steps.parse_health.outputs.ok }}\",
                  \"status\": \"${{ steps.parse_health.outputs.status }}\",
                  \"response_time\": \"${{ steps.health_check.outputs.response_time }}\"
                },
                \"backup_check\": {
                  \"supabase_ok\": \"${{ steps.supabase_check.outputs.supabase_ok }}\",
                  \"supabase_db_connected\": \"${{ steps.supabase_check.outputs.supabase_db_connected }}\",
                  \"supabase_response_time\": \"${{ steps.supabase_check.outputs.supabase_response_time }}\",
                  \"reason\": \"${{ steps.supabase_check.outputs.supabase_reason }}\"
                },
                \"environment\": \"${{ matrix.environment }}\",
                \"workflow_run\": \"${{ github.run_id }}\"
              }
            }" || echo "Failed to send enhanced alert"

      - name: Send Alert for Service Down
        if: steps.health_check.outputs.http_code == '200' && steps.parse_health.outputs.ok == 'false'
        run: |
          echo "🚨 Service down detected for ${{ matrix.environment }}"

          # Determine severity based on what's failing
          if [ "${{ steps.parse_health.outputs.db_connected }}" = "false" ]; then
            severity="critical"
            message="Database is disconnected"
          elif [ "${{ steps.parse_health.outputs.status }}" = "down" ]; then
            severity="critical"
            message="Service reports down status"
          else
            severity="warning"
            message="Service reports unhealthy status: ${{ steps.parse_health.outputs.status }}"
          fi

          # Send alert
          curl -X POST "${{ env.ALERT_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": \"$message\",
              \"severity\": \"$severity\",
              \"source\": \"github-actions-${{ matrix.environment }}\",
              \"metadata\": {
                \"status\": \"${{ steps.parse_health.outputs.status }}\",
                \"db_connected\": \"${{ steps.parse_health.outputs.db_connected }}\",
                \"db_latency\": \"${{ steps.parse_health.outputs.db_latency }}\",
                \"response_time\": \"${{ steps.health_check.outputs.response_time }}\",
                \"environment\": \"${{ matrix.environment }}\",
                \"workflow_run\": \"${{ github.run_id }}\",
                \"response_body\": ${{ toJson(steps.health_check.outputs.response_body) }}
              }
            }" || echo "Failed to send alert"

      - name: Send Alert for Degraded Performance
        if: steps.health_check.outputs.http_code == '200' && steps.parse_health.outputs.ok == 'true' && steps.parse_health.outputs.status == 'degraded'
        run: |
          echo "⚠️ Performance degradation detected for ${{ matrix.environment }}"

          curl -X POST "${{ env.ALERT_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": \"Service is responding slowly (DB latency: ${{ steps.parse_health.outputs.db_latency }}ms)\",
              \"severity\": \"warning\",
              \"source\": \"github-actions-${{ matrix.environment }}\",
              \"metadata\": {
                \"status\": \"${{ steps.parse_health.outputs.status }}\",
                \"db_latency\": \"${{ steps.parse_health.outputs.db_latency }}\",
                \"response_time\": \"${{ steps.health_check.outputs.response_time }}\",
                \"environment\": \"${{ matrix.environment }}\",
                \"workflow_run\": \"${{ github.run_id }}\"
              }
            }" || echo "Failed to send alert"

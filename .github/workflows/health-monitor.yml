# Optional: Health check for self-hosted deployment (e.g. behind nginx + DuckDNS).
# Set HEALTH_URL and ALERT_URL secrets to your deployed /api/health and /api/alerts.

name: Health Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  HEALTH_URL: ${{ secrets.HEALTH_URL }}
  ALERT_URL: ${{ secrets.ALERT_URL }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ env.HEALTH_URL != '' }}

    steps:
      - name: Check Health Endpoint
        id: health_check
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          CODE_TIME=$(curl -sS -m 30 -o "$BODY_FILE" -w "%{http_code} %{time_total}" "$HEALTH_URL" || echo "000 30.0")
          http_code=$(echo "$CODE_TIME" | awk '{print $1}')
          response_time=$(echo "$CODE_TIME" | awk '{print $2}')
          response_body=$(cat "$BODY_FILE" 2>/dev/null || echo "")
          rm -f "$BODY_FILE"
          echo "http_code=$http_code" >> $GITHUB_OUTPUT
          echo "response_time=$response_time" >> $GITHUB_OUTPUT
          printf "response_body<<EOF\n%s\nEOF\n" "$response_body" >> $GITHUB_OUTPUT

      - name: Parse Health Response
        id: parse_health
        if: steps.health_check.outputs.http_code == '200'
        run: |
          set -euo pipefail
          response='${{ steps.health_check.outputs.response_body }}'
          ok=false
          status="unknown"
          db_connected=false
          db_latency=0
          if command -v jq >/dev/null 2>&1; then
            ok=$(echo "$response" | jq -r '.ok // false' 2>/dev/null || echo false)
            status=$(echo "$response" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
            db_connected=$(echo "$response" | jq -r '.database.connected // false' 2>/dev/null || echo false)
            db_latency=$(echo "$response" | jq -r '.database.latencyMs // 0' 2>/dev/null || echo 0)
          fi
          echo "ok=$ok" >> $GITHUB_OUTPUT
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "db_connected=$db_connected" >> $GITHUB_OUTPUT
          echo "db_latency=$db_latency" >> $GITHUB_OUTPUT

      - name: Send Alert on Failure
        if: failure() && env.ALERT_URL != ''
        run: |
          curl -X POST "$ALERT_URL" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"Health check failed\", \"severity\": \"critical\", \"source\": \"github-actions\"}" || true

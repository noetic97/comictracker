[build]
  publish = "client/dist"
  command = "npm run build:staging"

[build.environment]
  NODE_VERSION = "22"
  # Force production mode for Vite builds (prevents dev dependency issues)
  NODE_ENV = "production"
  # Include dev dependencies for Vite/TypeScript builds
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  directory = "functions"

# Local development settings
[dev]
  command = "cd client && npm run dev"
  port = 8888
  targetPort = 3000
  publish = "client/dist"

# Production context (main branch only)
[context.production]
  command = "npm run build:prod"

[context.production.environment]
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"

# Dev branch context (staging)
[context.dev]
  command = "npm run build:staging"

[context.dev.environment]
  # Keep NODE_ENV=production for Vite build, use app logic to differentiate
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  # Use a separate variable to distinguish staging from production in your app
  DEPLOY_ENV = "staging"

# Redirect all API calls to functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache"